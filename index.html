<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Do It - ניהול אישי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="today"><i>☀️</i><span>היום</span></button>
    <button data-tab="upcoming"><i>🗓️</i><span>בקרוב</span></button>
    <button data-tab="tasks"><i>✅</i><span>משימות</span></button>
    <button data-tab="habits"><i>🔁</i><span>הרגלים</span></button>
    <button data-tab="goals"><i>🎯</i><span>יעדים</span></button>
    <button data-tab="vision"><i>🌟</i><span>חזון</span></button>
    <button data-tab="lists"><i>📝</i><span>רשימות</span></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
